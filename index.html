<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huellitas 🐾</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#28473c;background:#fffaf4}header{padding:20px 6%;background:white;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:27px}button{border:0;border-radius:30px;background:#315a48;color:white;padding:13px 20px;cursor:pointer;font:inherit}button.secondary{background:#f7e2d5;color:#315a48}.hero{background:#f8e5d8;padding:65px 6%;display:grid;grid-template-columns:1.5fr 1fr;gap:20px;align-items:center}h1{font-size:clamp(38px,6vw,72px);line-height:1.05;margin:0}h1 span{color:#d87f70}.hero p{font-size:19px;line-height:1.6}.art{font-size:120px;text-align:center}main{max-width:1050px;margin:auto;padding:35px 20px 110px}nav{display:flex;gap:8px;overflow:auto;margin:25px 0}nav button{white-space:nowrap;background:#f2eee7;color:#355346}nav button.active{background:#315a48;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{padding:24px;border-radius:22px;background:white;border:1px solid #eee6df;box-shadow:0 8px 20px #1b38200a}.muted{color:#748478}.empty{padding:40px;text-align:center;border:2px dashed #e3ded4;border-radius:20px}.record{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:14px 0}.record:last-child{border:0}.record button{background:#f9e7df;color:#a45b4e;padding:8px 12px}.modal{position:fixed;inset:0;background:#17291dbb;display:grid;place-items:center;padding:15px}.dialog{background:#fffaf5;border-radius:24px;padding:25px;width:min(500px,100%);max-height:90vh;overflow:auto}label{display:block;margin:12px 0 5px;font-weight:700}input,select,textarea{display:block;width:100%;padding:12px;border:1px solid #d9dfd6;border-radius:12px;font:inherit}textarea{min-height:70px}.actions{display:flex;gap:8px;margin-top:20px;justify-content:flex-end}.bottom{display:none}@media(max-width:650px){.hero{grid-template-columns:1fr;padding:45px 20px}.art{font-size:70px}.bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;justify-content:space-around;padding:12px 4px}.bottom button{font-size:11px;padding:7px;background:none;color:#315a48}nav{display:none}}</style><link rel="stylesheet" href="theme.css"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="icon.svg"><meta name="theme-color" content="#ffd6de"></head><body><header><div class="logo">🐾 Huellitas</div><button class="secondary" onclick="backup()">↓ Respaldo</button></header><section class="hero"><div><h1>Su bienestar, <span>todo en un lugar.</span></h1><p>Organiza vacunas, citas, medicamentos y los momentos especiales de tus mascotas, con cariño y sin complicaciones.</p><button onclick="change('mascotas');form('mascotas')">+ Agregar mi mascota</button></div><div class="art">🐶🐱</div></section><main><h2 id="heading">Mi resumen</h2><p class="muted">Tu organizador personal de mascotas</p><nav id="nav"></nav><div id="content"></div></main><div id="bottom" class="bottom"></div><div id="modal"></div><script>
const names={inicio:'Inicio',mascotas:'Mascotas',agenda:'Agenda',vacunas:'Vacunas',medicamentos:'Medicinas',gastos:'Gastos',familia:'Familia'},icons={inicio:'🏡',mascotas:'🐾',agenda:'📅',vacunas:'💉',medicamentos:'💊',gastos:'💰',familia:'👪'};let section='inicio';const blank=()=>({mascotas:[],agenda:[],vacunas:[],medicamentos:[],gastos:[]});let data;try{data=JSON.parse(localStorage.getItem('huellitas-v1'))||blank()}catch{data=blank()}const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const persist=()=>{localStorage.setItem('huellitas-v1',JSON.stringify(data));render()};function change(s){section=s;render();document.querySelector('main').scrollIntoView({behavior:'smooth'})}function render(){document.getElementById('heading').textContent=section==='inicio'?'Mi resumen':names[section];document.getElementById('nav').innerHTML=Object.keys(names).map(s=>'<button class="'+(s===section?'active':'')+'" onclick="change(\''+s+'\')">'+icons[s]+' '+names[s]+'</button>').join('');document.getElementById('bottom').innerHTML=['inicio','mascotas','agenda','vacunas','familia'].map(s=>'<button onclick="change(\''+s+'\')">'+icons[s]+'<br>'+names[s]+'</button>').join('');let el=document.getElementById('content');if(section==='familia'){el.innerHTML='<div class="card"><h3>Compartir con familiares</h3><p>Próximamente, al configurar cuentas seguras y sincronización con Supabase. Esta versión es personal y local.</p></div>';return}if(section==='inicio'){el.innerHTML='<div class="cards"><div class="card"><h3>🐾 Mascotas</h3><h1>'+data.mascotas.length+'</h1></div><div class="card"><h3>📅 Citas</h3><h1>'+data.agenda.length+'</h1></div><div class="card"><h3>💚 Gastos</h3><h1>₡'+data.gastos.reduce((a,x)=>a+Number(x.monto||0),0).toLocaleString('es-CR')+'</h1></div></div><h2>Mis mascotas</h2>'+petCards();return}el.innerHTML='<p><button onclick="form(\''+section+'\')">+ Agregar '+names[section]+'</button></p>'+(section==='mascotas'?petCards():data[section].length?'<div class="card">'+data[section].map(x=>'<div class="record"><div><b>'+esc(x.nombre)+'</b><p class="muted">'+esc(data.mascotas.find(p=>p.id===x.pet)?.nombre||'')+' · '+esc(x.fecha||'')+(x.monto?' · ₡'+esc(x.monto):'')+'</p>'+esc(x.notas||'')+'</div><button onclick="remove(\''+section+'\',\''+x.id+'\')">Eliminar</button></div>').join('')+'</div>':'<div class="empty">🐾 Aún no hay registros.</div>')}function petCards(){return data.mascotas.length?'<div class="cards">'+data.mascotas.map(p=>'<div class="card"><div style="font-size:55px">'+(p.especie==='Gato'?'🐱':'🐶')+'</div><h3>'+esc(p.nombre)+'</h3><p>'+esc(p.especie)+' · '+esc(p.raza||'')+'</p><button class="secondary" onclick="form(\'mascotas\',\''+p.id+'\')">Editar</button> <button class="secondary" onclick="remove(\'mascotas\',\''+p.id+'\')">Eliminar</button></div>').join('')+'</div>':'<div class="empty">🐾 Agrega tu primera mascota.</div>'}function remove(s,id){if(confirm('¿Eliminar registro?')){data[s]=data[s].filter(x=>x.id!==id);persist()}}function form(s,id){if(s!=='mascotas'&&!data.mascotas.length){alert('Primero registra una mascota.');change('mascotas');return}let p=data.mascotas.find(x=>x.id===id)||{};let fields=s==='mascotas'?'<label>Nombre</label><input name="nombre" required value="'+esc(p.nombre||'')+'"><label>Especie</label><select name="especie"><option '+(p.especie==='Perro'?'selected':'')+'>Perro</option><option '+(p.especie==='Gato'?'selected':'')+'>Gato</option><option>Otro</option></select><label>Raza</label><input name="raza" value="'+esc(p.raza||'')+'"><label>Nacimiento</label><input type="date" name="nacimiento" value="'+esc(p.nacimiento||'')+'">':'<label>Mascota</label><select name="pet">'+data.mascotas.map(p=>'<option value="'+p.id+'">'+esc(p.nombre)+'</option>').join('')+'</select><label>'+(s==='gastos'?'Concepto':'Nombre')+'</label><input name="nombre" required><label>Fecha</label><input type="date" name="fecha" required value="'+new Date().toISOString().slice(0,10)+'">'+(s==='gastos'?'<label>Monto en colones</label><input type="number" name="monto" min="0" step=".01" required>':'')+'<label>Notas</label><textarea name="notas"></textarea>';document.getElementById('modal').innerHTML='<div class="modal"><div class="dialog"><h2>'+names[s]+'</h2><form id="entry">'+fields+'<div class="actions"><button type="button" class="secondary" onclick="closeForm()">Cancelar</button><button>Guardar</button></div></form></div></div>';document.getElementById('entry').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));if(id)Object.assign(p,v);else data[s].push({id:crypto.randomUUID(),...v});closeForm();persist()}}function closeForm(){document.getElementById('modal').innerHTML=''}function backup(){let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download='huellitas-respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}render();</script><script src="extras.js"></script><script src="care-plus.js"></script></body></html>
